[package]
name = "glassic"
version = "2.0.0"
edition = "2021"
description = "Glassic — Desktop Media Widget & OBS Studio Server"

[[bin]]
name = "Glassic"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ureq = { version = "2.10", features = ["json"] }
tungstenite = "0.24"
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
